global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    monitor: phishcraft

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Experiment metrics — manifest + LLM traces (runs-exporter container).
  - job_name: phishcraft-experiment
    static_configs:
      - targets: ["runs-exporter:9091"]

  # GPU / VRAM on the Ollama host (gpu_exporter.py runs on the host).
  - job_name: phishcraft-gpu
    static_configs:
      - targets: ["host.docker.internal:9400"]

  # The FastAPI service, when running on the host (uvicorn app.main:app).
  - job_name: phishcraft-api
    static_configs:
      - targets: ["host.docker.internal:8000"]
