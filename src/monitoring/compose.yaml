# PhishCraft observability stack: Prometheus + Alertmanager + Grafana.
#
#   docker compose -f monitoring/compose.yaml up -d
#   # dashboards:  http://localhost:3000 (admin / admin)
#   # prometheus:  http://localhost:9090
#   # alertmanager: http://localhost:9093
#
# The two Python exporters run ON THE HOST (they need the repo's files and
# nvidia-smi):
#   venv/bin/python monitoring/runs_exporter.py   # :9091
#   venv/bin/python monitoring/gpu_exporter.py    # :9400
# Prometheus reaches them via host.docker.internal.
#
# Alert notifications land in the existing MailHog sink (compose.yaml at the
# repo root, :8025) through Alertmanager's SMTP email config.

services:
  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: phishcraft-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      # 9099: a system-level Prometheus already owns host port 9090 on this
      # machine; the container itself keeps the conventional 9090 inside.
      - "9099:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: phishcraft-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: phishcraft-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: phishcraft-node-exporter
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
      - --collector.diskstats
      - --collector.netdev
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    restart: unless-stopped

  runs-exporter:
    build:
      context: .
      dockerfile: Dockerfile.exporter
    container_name: phishcraft-runs-exporter
    environment:
      - RUNS_EXPORTER_DIRS=/experiment
      - RUNS_EXPORTER_PORT=9091
    volumes:
      - ../experiment:/experiment:ro
    ports:
      - "9091:9091"
    restart: unless-stopped

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
